name: Feature request
description: Suggest an idea for the plugin.
title: "[Feature]: "
labels: ["enhancement"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for the suggestion. This plugin is intentionally small and unobtrusive, so new features need to earn their place.

    - type: textarea
      id: problem
      attributes:
          label: What problem does this solve?
          description: What is the use case, and why does the current plugin fall short?
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          description: How do you imagine this working?
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Other ways this could be done, or reasons not to add it.

    - type: textarea
      id: extra
      attributes:
          label: Anything else?
          description: Mockups, references to similar tools or edge cases to think about.
